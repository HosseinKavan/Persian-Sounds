name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate word data
        run: python3 tools/validate_words.py

      - name: Generate phoneme targets and AvaSanj ONNX model
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check             "torch>=2.5"             "transformers>=4.50"             "huggingface_hub>=0.30"             "onnx>=1.17"             "onnxruntime>=1.22"             "onnxscript>=0.3"
          python3 tools/generate_phoneme_targets.py
          python3 tools/export_avasanj_onnx.py
          test -f app/src/main/assets/phoneme_targets.json
          test -f app/src/main/assets/avasanj/avasanj_int8.onnx
          test -f app/src/main/assets/avasanj/vocabulary.json

      - name: Generate natural Persian lesson audio
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check edge-tts
          python3 tools/generate_word_audio.py
          test "$(find app/src/main/res/raw -name 'word_*.mp3' | wc -l)" -eq 50
          test "$(find app/src/main/res/raw -name 'question_first_*.mp3' | wc -l)" -eq 50
          test "$(find app/src/main/res/raw -name 'question_last_*.mp3' | wc -l)" -eq 50
          test -f app/src/main/res/raw/feedback_correct.mp3
          test -f app/src/main/res/raw/feedback_wrong.mp3
          test -f app/src/main/res/raw/feedback_unclear.mp3
          test -f app/src/main/res/raw/feedback_complete.mp3

      - name: Run tests and build v1.5 APKs
        run: gradle --no-daemon test assembleDebug

      - name: Prepare named APKs
        shell: bash
        run: |
          echo "Available APK outputs:"
          find app/build/outputs/apk -type f -name "*.apk" -print

          ARM64="$(find app/build/outputs/apk -type f -name "*arm64-v8a*debug*.apk" | head -n 1)"
          UNIVERSAL="$(find app/build/outputs/apk -type f \( -name "*universal*debug*.apk" -o -name "app-debug.apk" \) | head -n 1)"

          test -n "$ARM64"
          test -n "$UNIVERSAL"

          cp "$ARM64" Persian-Sounds-v1.5-arm64-debug.apk
          cp "$UNIVERSAL" Persian-Sounds-v1.5-universal-debug.apk

      - name: Show APK sizes
        run: |
          ls -lh Persian-Sounds-v1.5-arm64-debug.apk
          ls -lh Persian-Sounds-v1.5-universal-debug.apk

      - name: Upload ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Persian-Sounds-v1.5-arm64-apk
          path: Persian-Sounds-v1.5-arm64-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Persian-Sounds-v1.5-universal-apk
          path: Persian-Sounds-v1.5-universal-debug.apk
          if-no-files-found: error
          retention-days: 90
